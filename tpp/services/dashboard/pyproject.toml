[project]
name = "tpp-dashboard"
version = "0.1.2"
description = "TPP unified ops dashboard (quota / channel consumption / channel performance)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dashboard = "dashboard.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dashboard"]

[tool.setuptools.package-data]
dashboard = ["static/*"]
