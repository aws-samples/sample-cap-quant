# TPP 渠道注册表:Scorer 启动时经 /model/new 同步进 LiteLLM DB(幂等,按 model_info.id)。
# 渠道定义放这里而非 LiteLLM 静态 config —— 静态 config 模型无法通过 Management API 动态调权。
# model_info.id 是稳定渠道 ID,同时出现在 Prometheus 指标的 model_id label 中。

channels:
  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5
      aws_region_name: us-west-2
      weight: 50
    model_info:
      id: claude-sonnet-5--bedrock-usw2

  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5
      aws_region_name: us-east-1
      weight: 50
    model_info:
      id: claude-sonnet-5--bedrock-use1

  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-5
      aws_region_name: us-west-2
      weight: 50
    model_info:
      id: claude-opus-5--bedrock-usw2

  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-5
      aws_region_name: us-east-1
      weight: 50
    model_info:
      id: claude-opus-5--bedrock-use1

  - model_name: claude-fable-5
    litellm_params:
      model: bedrock/us.anthropic.claude-fable-5
      aws_region_name: us-west-2
      weight: 50
    model_info:
      id: claude-fable-5--bedrock-usw2

  - model_name: claude-fable-5
    litellm_params:
      model: bedrock/us.anthropic.claude-fable-5
      aws_region_name: us-east-1
      weight: 50
    model_info:
      id: claude-fable-5--bedrock-use1

  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-west-2
      weight: 50
    model_info:
      id: claude-haiku-4-5--bedrock-usw2

  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-east-1
      weight: 50
    model_info:
      id: claude-haiku-4-5--bedrock-use1

  # OpenAI 模型经 Bedrock Mantle 提供;目前仅 us-west-2 单渠道(Codex CLI 接入用)
  # 必须走 LiteLLM 的 bedrock_mantle/ 路由(OpenAI 兼容端点,原生透传 Responses API 与
  # reasoning);写成 bedrock/us.openai.* 会走 Claude 的 converse 转换,把 reasoning_effort
  # 译成 thinking 而被 Mantle 以 unknown_parameter 拒绝。IRSA 需 bedrock-mantle:CreateInference。
  - model_name: gpt-5.6-terra
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-terra
      aws_region_name: us-west-2
      weight: 100
    model_info:
      id: gpt-5.6-terra--bedrock-usw2
