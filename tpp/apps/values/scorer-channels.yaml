# TPP channel registry: synced into the LiteLLM DB via /model/new at Scorer startup (idempotent, keyed by model_info.id).
# Channel definitions live here rather than in the LiteLLM static config -- models in the static config cannot have weights adjusted dynamically via the Management API.
# model_info.id is the stable channel ID and also appears in the model_id label of Prometheus metrics.

channels:
  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5
      aws_region_name: us-west-2
      weight: 50
    model_info:
      id: claude-sonnet-5--bedrock-usw2

  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5
      aws_region_name: us-east-1
      weight: 50
    model_info:
      id: claude-sonnet-5--bedrock-use1

  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-5
      aws_region_name: us-west-2
      weight: 50
    model_info:
      id: claude-opus-5--bedrock-usw2

  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-5
      aws_region_name: us-east-1
      weight: 50
    model_info:
      id: claude-opus-5--bedrock-use1

  - model_name: claude-fable-5
    litellm_params:
      model: bedrock/us.anthropic.claude-fable-5
      aws_region_name: us-west-2
      weight: 50
    model_info:
      id: claude-fable-5--bedrock-usw2

  - model_name: claude-fable-5
    litellm_params:
      model: bedrock/us.anthropic.claude-fable-5
      aws_region_name: us-east-1
      weight: 50
    model_info:
      id: claude-fable-5--bedrock-use1

  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-west-2
      weight: 50
    model_info:
      id: claude-haiku-4-5--bedrock-usw2

  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-east-1
      weight: 50
    model_info:
      id: claude-haiku-4-5--bedrock-use1

  # OpenAI models are served via Bedrock Mantle; currently a single channel in us-west-2 only (for Codex CLI integration).
  # Must use LiteLLM's bedrock_mantle/ route (OpenAI-compatible endpoint, natively passes through the Responses API
  # and reasoning); writing bedrock/us.openai.* would go through Claude's converse conversion, translating reasoning_effort
  # into thinking, which Mantle rejects as unknown_parameter. IRSA requires bedrock-mantle:CreateInference.
  - model_name: gpt-5.6-terra
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-terra
      aws_region_name: us-west-2
      weight: 100
    model_info:
      id: gpt-5.6-terra--bedrock-usw2
