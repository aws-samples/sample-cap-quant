# LiteLLM Proxy 生产配置(EKS)。
# 渠道定义不在此文件 —— 注册表在 apps/values/scorer-channels.yaml,由 Scorer 经
# /model/new 写入 DB(store_model_in_db),这样 weight 才能被 Management API 动态调整。

model_list: []

litellm_settings:
  # langfuse_otel:OTLP 协议,适配 Langfuse v4(旧版 "langfuse" callback 会被 v4 拒绝)
  success_callback: ["prometheus", "langfuse_otel"]
  failure_callback: ["prometheus", "langfuse_otel"]

router_settings:
  routing_strategy: simple-shuffle # 按 weight 加权,配合 Scorer 调权
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  allowed_fails: 3
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
