prometheus:
  prometheusSpec:
    retention: 15d
    # Key: must be false to scrape ServiceMonitors/PodMonitors declared outside Helm values
    # (litellm in M3 and scorer in M5 both rely on this)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi

grafana:
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
  # dev uses port-forward access for now; enable when exposing an Ingress (requires domain/certificate decisions)
  service:
    type: ClusterIP

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
