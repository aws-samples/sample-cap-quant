# LiteLLM Proxy config (local verification version; in the cloud, apps/litellm.tf's Helm values provide the equivalent config)
#
# Core concept: multiple entries under the same model_name = multiple channels (deployments) in the same model group.
# LiteLLM splits traffic proportionally by weight; the Scorer dynamically adjusts weight every minute.

model_list:
  # ---- Model group claude-opus-5: Anthropic direct + Bedrock, two channels ----
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
      weight: 50
    model_info:
      channel: anthropic-direct
  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/anthropic.claude-opus-5
      aws_region_name: us-west-2
      # For local verification, use AWS_BEARER_TOKEN_BEDROCK or a local AWS profile;
      # on EKS this uses IRSA, so no static credentials are configured here
      weight: 50
    model_info:
      channel: aws-bedrock

  # ---- Model group gpt-5: OpenAI direct (adjust model name per actual subscription) ----
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
      weight: 100
    model_info:
      channel: openai-direct

  # ---- Model group gpt-5.6-terra: OpenAI model via Bedrock Mantle, single channel (for Codex CLI access) ----
  # Credentials same as the Bedrock channel above: local AWS profile or AWS_BEARER_TOKEN_BEDROCK
  # Must use the bedrock_mantle/ route (OpenAI-compatible endpoint, passes through the Responses API and reasoning);
  # bedrock/us.openai.* would go through the Claude converse transformation, where reasoning_effort gets translated into thinking and errors out
  - model_name: gpt-5.6-terra
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-terra
      aws_region_name: us-west-2
      weight: 100
    model_info:
      channel: aws-bedrock-mantle

  # ---- Aggregator channel example (OpenRouter, uncomment when needed) ----
  # - model_name: claude-opus-5
  #   litellm_params:
  #     model: openrouter/anthropic/claude-opus-5
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     weight: 0        # starts at 0; the Scorer ramps it up from the exploration floor traffic
  #   model_info:
  #     channel: openrouter

litellm_settings:
  # M0 verification item: confirm the OSS prometheus callback works; if not, switch to a self-built exporter callback
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  # After enabling the trace profile, append:
  # success_callback: ["prometheus", "langfuse"]
  # failure_callback: ["prometheus", "langfuse"]

router_settings:
  routing_strategy: simple-shuffle   # weighted random by weight, works with the Scorer's dynamic weight tuning
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  allowed_fails: 3                   # LiteLLM's own circuit breaking: 3 failures in the window triggers cooldown
  cooldown_time: 60                  # seconds; mutual backstop with the Scorer's circuit breaker

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
