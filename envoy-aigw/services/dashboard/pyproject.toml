[project]
name = "aigw-dashboard"
version = "0.1.4"
description = "Envoy AI Gateway ops dashboard (clients / models / performance / gateway health)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "boto3>=1.35",
    "kubernetes>=31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dashboard = "dashboard.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dashboard"]

[tool.setuptools.package-data]
dashboard = ["static/*"]
