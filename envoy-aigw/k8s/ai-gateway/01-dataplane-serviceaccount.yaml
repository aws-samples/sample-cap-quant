# ServiceAccount used by the Envoy data-plane pods (Envoy + AI Gateway extproc sidecar).
# EKS Pod Identity maps it to the aigw-dev-aigw-bedrock IAM role (apps/pod-identity.tf), so the
# AWS SDK default credential chain inside extproc signs Bedrock / Mantle requests with SigV4.
# Must live in the Envoy Gateway infra namespace, where the proxy pods are created.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gateway-dataplane-aws
  namespace: envoy-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-gateway-dataplane-aws
  namespace: envoy-gateway-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-gateway-dataplane-aws
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-gateway-dataplane-aws
subjects:
  - kind: ServiceAccount
    name: ai-gateway-dataplane-aws
    namespace: envoy-gateway-system
